# Profil "test" : complète src/main/resources/application.yml, ne le remplace pas.
# Activé par @ActiveProfiles("test") sur les classes de test Spring.

spring:
  # Identifiants factices, aucun test n'appelle réellement Discord.
  security:
    oauth2:
      client:
        registration:
          discord:
            client-id: test-client-id
            client-secret: test-client-secret

  # L'URL réelle est fournie par Testcontainers via @ServiceConnection.
  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test

portal:
  bootstrap-admin:
  oidc:
    issuer: http://portal.localhost
    signing-key:
  modules:
    - key: exemple
      label: Module d'exemple
      description: Gabarit.
      icon: exemple
      url: http://exemple.localhost:9001/
      minimum-role: USER
      enabled: true
      client:
        client-secret: secret-exemple
        redirect-uris:
          - http://exemple.localhost:9001/login/oauth2/code/miyoshiix
        post-logout-redirect-uris:
          - http://exemple.localhost:9001/
    - key: admin-only
      label: Réservé admin
      description: Visible seulement par un ADMIN.
      icon: admin
      url: http://admin.localhost:9002/
      minimum-role: ADMIN
      enabled: true
      client:
        client-secret: secret-admin
        redirect-uris:
          - http://admin.localhost:9002/login/oauth2/code/miyoshiix
    - key: desactive
      label: Module désactivé
      description: Ne doit jamais apparaître.
      icon: desactive
      url: http://desactive.localhost:9003/
      minimum-role: USER
      enabled: false
      client:
        client-secret: secret-desactive
        redirect-uris:
          - http://desactive.localhost:9003/login/oauth2/code/miyoshiix

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
